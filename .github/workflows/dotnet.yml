name: Build and test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build plugin
        run: dotnet build TelegramNotifier/TelegramNotifier.csproj --configuration Release
      - name: Run integration tests (fake Swiftly host, intercepted HTTP)
        run: dotnet run --project tests/tests.csproj --configuration Release
      - name: Publish plugin
        run: dotnet publish TelegramNotifier/TelegramNotifier.csproj --configuration Release --output artifacts/TelegramNotifier
      - uses: actions/upload-artifact@v4
        with:
          name: TelegramNotifier-SwiftlyS2
          path: artifacts/TelegramNotifier/
